<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5e4b">
<title>Do-2-day</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1d2421;--mut:#6b7570;--line:#dcd8cf;--ac:#1f5e4b;--acs:#dcebe5;--warn:#b4531a;--bad:#a8322d;--good:#1f7a4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b2220;--ink:#e8ece9;--mut:#93a09a;--line:#2d3733;--ac:#5fc29d;--acs:#23362f;--warn:#e29a5f;--bad:#e8837d;--good:#6fd09b}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b2220;--ink:#e8ece9;--mut:#93a09a;--line:#2d3733;--ac:#5fc29d;--acs:#23362f;--warn:#e29a5f;--bad:#e8837d;--good:#6fd09b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,"Times New Roman",serif;padding-bottom:80px}
h1,h2,h3,button,input,select,nav,.sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:4px 0 2px}h2{font-size:1.05rem;margin:22px 0 8px}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.row{display:flex;align-items:center;gap:10px}.row>.g{flex:1;min-width:0}
.mut{color:var(--mut);font-size:.85rem}
.alert{border-left:4px solid var(--warn);background:var(--card);border-radius:6px;padding:9px 12px;margin:6px 0;font-size:.92rem}
.alert.bad{border-color:var(--bad)}.alert.ok{border-color:var(--good)}
input,select{font-size:1rem;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.f .w{grid-column:1/-1}
button{font-size:.95rem;padding:9px 14px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--onac,#fff);cursor:pointer}
@media (prefers-color-scheme:dark){button{color:var(--onac,#10201a)}}
button.s{background:transparent;color:var(--ac)}button.x{background:none;border:0;color:var(--mut);padding:10px 14px;font-size:1.1rem}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--nav,var(--card));border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--navink,var(--mut));border-radius:0;padding:13px 2px;font-size:.82rem}
nav button.on{color:var(--navon,var(--ac));font-weight:700;box-shadow:inset 0 3px 0 var(--ac)}
.bar{height:8px;background:var(--acs);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.done{text-decoration:line-through;color:var(--mut)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal b{font:600 .72rem system-ui;color:var(--mut)}
.cal button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:8px 0;font-size:.9rem;position:relative}
.cal button.t{border-color:var(--ac);font-weight:700}.cal button.sel{background:var(--ac);color:var(--onac,#fff)}
.cal button.dot::after{content:"";position:absolute;bottom:3px;left:calc(50% - 3px);width:6px;height:6px;border-radius:50%;background:var(--warn)}
.inc{color:var(--good)}.exp{color:var(--bad)}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1}.brand{display:flex;align-items:center;gap:10px}.brand svg{width:46px;height:46px;flex:none}a.btn{display:inline-block;font:.95rem system-ui,sans-serif;padding:9px 14px;border-radius:8px;background:var(--ac);color:var(--onac,#fff);text-decoration:none}@media (prefers-color-scheme:dark){a.btn{color:var(--onac,#10201a)}}
.me{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--ac);flex:none}.pv{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--acs);flex:none}.sw{width:38px;height:38px;border-radius:50%;padding:0;border:3px solid transparent}.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}.wpg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.wpb{height:60px;border-radius:8px;border:3px solid transparent;color:#fff;font-size:.85rem;padding:4px;text-transform:capitalize}.wpb.on{border-color:var(--ink)}input[type=color]{padding:0;height:42px;margin-top:4px}input[type=range]{padding:0;margin-top:4px}label{display:block}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}main{width:100%;flex:1}#cr{text-align:center;color:var(--mut);font:.78rem/1.5 system-ui,sans-serif;padding:18px 16px 6px}#cr img{margin-top:6px;border-radius:50%;background:#fff}
.top{display:flex;align-items:center;gap:12px;margin:0 0 10px}.top .g{min-width:0}.av{width:50px;height:50px;border-radius:50%;padding:0;overflow:hidden;border:2px solid var(--ac);background:var(--acs);color:var(--ac);font-size:1.5rem;flex:none}.av img{width:100%;height:100%;object-fit:cover;display:block}.nm{font:600 1.05rem system-ui,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<main id="app"></main>
<footer id="cr">© Derick Malelo and ElectroCat Company Ltd<br><img src="electrocat-logo.png" alt="ElectroCat logo" width="44" height="44"></footer>
<nav id="nav"></nav>
<script>
var K="lifeplanner.v1",T="today",sel=td(),cm=td().slice(0,7),txType="expense";
function def(){return{tasks:[],events:[],contacts:[],tx:[],set:{budget:0,goal:0},notified:""}}
var S=(function(){try{var d=JSON.parse(localStorage.getItem(K));return d&&d.tasks?d:def()}catch(e){return def()}})();
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var LOGO="<svg viewBox='0 0 120 120' role='img' aria-label='Do-2-day logo'><defs><linearGradient id='lg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#4b2fb8'/><stop offset='1' stop-color='#0e9f94'/></linearGradient></defs><rect width='120' height='120' rx='27' fill='url(#lg)'/><circle cx='60' cy='60' r='46' fill='#fff' fill-opacity='.14' stroke='#fff' stroke-opacity='.55' stroke-width='3'/><path d='M60 17v7M60 96v7M17 60h7M96 60h7' stroke='#fff' stroke-opacity='.7' stroke-width='3' stroke-linecap='round'/><path d='M60 60L44 44M60 60L82 40' stroke='#fff' stroke-opacity='.85' stroke-width='4' stroke-linecap='round'/><rect x='20' y='88' width='21' height='16' rx='2' fill='#ff7a59'/><rect x='41' y='74' width='21' height='30' fill='#ffc233'/><rect x='62' y='60' width='21' height='44' fill='#37c97f'/><rect x='83' y='46' width='21' height='58' rx='2' fill='#ff5fa2'/><path d='M40 60Q62 34 86 33' stroke='#ffe066' stroke-width='1.8' stroke-dasharray='1 4' stroke-linecap='round' fill='none'/><polygon points='94,25 96,30.25 101.6,30.5 97.2,34 98.7,39.5 94,36.4 89.3,39.5 90.8,34 86.4,30.5 92,30.25' fill='#ffe066'/><ellipse cx='27' cy='87' rx='3.2' ry='2' fill='#ffd9b8'/><ellipse cx='34' cy='87' rx='3.2' ry='2' fill='#ffd9b8'/><ellipse cx='30.5' cy='80' rx='6.5' ry='7' fill='#fff'/><path d='M35 78l6-9M26 79l-2 4' stroke='#ffd9b8' stroke-width='3' stroke-linecap='round'/><circle cx='30.5' cy='67' r='7.5' fill='#ffd9b8'/><path d='M29 60c1-3 4-3 5 0' stroke='#6b3f1d' stroke-width='1.6' fill='none' stroke-linecap='round'/><circle cx='28' cy='66' r='1.9' fill='#fff'/><circle cx='33' cy='66' r='1.9' fill='#fff'/><circle cx='28.7' cy='65.3' r='1' fill='#222'/><circle cx='33.7' cy='65.3' r='1' fill='#222'/><path d='M28.5 70q2 1.6 4 0' stroke='#b5533c' stroke-width='1.2' fill='none' stroke-linecap='round'/></svg>";
function setIcons(){try{var u="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(LOGO.replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" '));var l=document.createElement("link");l.rel="icon";l.href=u;document.head.appendChild(l);var im=new Image();im.onload=function(){try{var c=document.createElement("canvas");c.width=c.height=180;c.getContext("2d").drawImage(im,0,0,180,180);var a=document.createElement("link");a.rel="apple-touch-icon";a.href=c.toDataURL("image/png");document.head.appendChild(a)}catch(e){}};im.src=u}catch(e){}}
function fix(){S.pool=S.pool||[];S.daily=S.daily||{date:"",ids:[]}}fix();function pad(n){return(n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function td(){return iso(new Date())}
function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function add(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function diff(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function v(id){return document.getElementById(id).value.trim()}
function money(n){return(n<0?"-":"")+Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:2})}
function nice(s){return pd(s).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})}
var CATS={Food:"food lunch dinner breakfast grocer restaurant coffee snack meal",Transport:"bus taxi uber fuel petrol diesel fare transport ride train",Bills:"electric water internet rent wifi airtime data bill subscription",Health:"medic pharmacy doctor hospital clinic drug",Education:"school fees book tuition course exam",Shopping:"cloth shoe shop mall market buy",Family:"gift mother father brother sister family support",Fun:"movie game party cinema trip outing"};
function guess(n){n=n.toLowerCase();for(var c in CATS){var w=CATS[c].split(" ");for(var i=0;i<w.length;i++)if(n.indexOf(w[i])>-1)return c}return"Other"}
function nextOcc(e){if(!e.yearly)return e.date;var d=pd(e.date),t=pd(td()),n=new Date(t.getFullYear(),d.getMonth(),d.getDate());if(n<t)n=new Date(t.getFullYear()+1,d.getMonth(),d.getDate());return iso(n)}
function callDue(c){return c.last?add(c.last,c.freq):td()}
function monthTx(){return S.tx.filter(function(x){return x.date.slice(0,7)==td().slice(0,7)})}
function sums(){var i=0,e=0,cat={};monthTx().forEach(function(x){if(x.type=="income")i+=x.amt;else{e+=x.amt;cat[x.cat]=(cat[x.cat]||0)+x.amt}});return{i:i,e:e,s:i-e,cat:cat}}
function alerts(){var a=[],t=td(),m=sums();
S.tasks.filter(function(x){return!x.done&&x.date<t}).forEach(function(x){a.push(["bad","Overdue: "+x.title+" ("+nice(x.date)+")"])});
S.events.forEach(function(e){var d=diff(t,nextOcc(e));if(d>=0&&d<=7)a.push(["",(d==0?"Today":d==1?"Tomorrow":"In "+d+" days")+": "+e.title])});
S.contacts.forEach(function(c){if(callDue(c)<=t)a.push(["",(diff(callDue(c),t)>0?"Call overdue: ":"Call today: ")+c.name])});
picks().forEach(function(p){if(p.last!=t&&!S.contacts.some(function(c){return c.name==p.name&&callDue(c)<=t}))a.push(["","Call today: "+p.name])});var b=S.set.budget;if(b>0){if(m.e>b)a.push(["bad","Over budget by "+money(m.e-b)+" this month"]);else if(m.e>=b*.8)a.push(["","You have used "+Math.round(m.e/b*100)+"% of this month’s budget"])}
if(S.set.goal>0&&m.s<S.set.goal&&new Date().getDate()>=20)a.push(["","Savings "+money(m.s)+" of "+money(S.set.goal)+" goal, month is nearly over"]);
return a}
function notify(){if(!("Notification"in window)||Notification.permission!="granted"||S.notified==td())return;var a=alerts();if(!a.length)return;S.notified=td();save();try{new Notification("Do-2-day",{body:a.slice(0,4).map(function(x){return x[1]}).join("\n")})}catch(e){}}
function ask(){if(!("Notification"in window))return alert("This browser does not support notifications.");Notification.requestPermission().then(function(){notify();render()})}
function go(t){T=t;render()}
function tasksOn(d){return S.tasks.filter(function(x){return x.date==d})}
function eventsOn(d){return S.events.filter(function(e){return e.yearly?e.date.slice(5)==d.slice(5):e.date==d})}
function taskRow(x){return'<div class="card row"><input type="checkbox" '+(x.done?"checked":"")+' onchange="tog(\''+x.id+'\')"><div class="g '+(x.done?"done":"")+'">'+esc(x.title)+'<div class="mut">'+nice(x.date)+(x.time?" · "+x.time:"")+(x.snd?" · 🔔 "+x.snd:"")+'</div></div><button class="x" onclick="del(\'tasks\',\''+x.id+'\')">✕</button></div>'}
function tog(id){S.tasks.forEach(function(x){if(x.id==id)x.done=!x.done});save();render()}
function del(k,id){S[k]=S[k].filter(function(x){return x.id!=id});save();render()}
function addTask(d){var t=v("tt");if(!t)return;S.tasks.push({id:uid(),title:t,date:d||v("td")||td(),time:v("tm"),snd:v("ts"),done:false});save();render()}
function addEvent(){var t=v("et"),d=v("ed");if(!t||!d)return;S.events.push({id:uid(),title:t,date:d,yearly:v("ey")=="y",snd:v("es")});save();render()}
function addContact(){var n=v("cn");if(!n)return;S.contacts.push({id:uid(),name:n,rel:v("cr"),freq:+v("cf")||7,last:""});save();render()}
function called(id){S.contacts.forEach(function(c){if(c.id==id)c.last=td()});save();render()}
function addTx(){var a=parseFloat(v("xa")),n=v("xn");if(!a||a<=0)return;var c=txType=="income"?"Income":(v("xc")||guess(n));S.tx.push({id:uid(),type:txType,amt:a,note:n,cat:c,date:v("xd")||td()});save();render()}
function setBG(){S.set.budget=parseFloat(v("sb"))||0;S.set.goal=parseFloat(v("sg"))||0;save();render()}
function setType(t){txType=t;render()}
function exportData(){var b=new Blob([JSON.stringify(S)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="do-2-day-backup.json";a.click()}
function importData(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(d.tasks){S=d;fix();save();render()}else alert("Not a Life Planner backup.")}catch(x){alert("Could not read that file.")}};r.readAsText(f)}
function pickDay(d){sel=d;render()}
function shift(n){var p=cm.split("-");var d=new Date(+p[0],+p[1]-1+n,1);cm=d.getFullYear()+"-"+pad(d.getMonth()+1);render()}

function rand(n){var t=td(),c=S.pool.filter(function(p){return!p.last||diff(p.last,t)>=7});if(c.length<n)c=S.pool.slice();for(var i=c.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=c[i];c[i]=c[j];c[j]=x}return c.slice(0,n).map(function(p){return p.id})}
function picks(){var t=td();fix();if(S.pool.length&&(S.daily.date!=t||!S.daily.ids.length)){S.daily={date:t,ids:rand(2)};save()}return S.daily.ids.map(function(id){return S.pool.filter(function(p){return p.id==id})[0]}).filter(Boolean)}
function reroll(){S.daily={date:td(),ids:rand(2)};save();render()}
function poolCalled(id){S.pool.forEach(function(p){if(p.id==id)p.last=td()});save();render()}
function clearPool(){if(confirm("Remove all imported contacts?")){S.pool=[];S.daily={date:"",ids:[]};save();render()}}
function addPool(list){var n=0;list.forEach(function(c){var nm=c.name||c.tel;if(!nm)return;if(S.pool.some(function(p){return p.name==nm&&p.tel==(c.tel||"")}))return;S.pool.push({id:uid(),name:nm,tel:c.tel||"",last:""});n++});save();render();alert(n+" contacts added.")}
function pickContacts(){navigator.contacts.select(["name","tel"],{multiple:true}).then(function(r){addPool(r.map(function(c){return{name:(c.name&&c.name[0])||"",tel:(c.tel&&c.tel[0])||""}}))}).catch(function(){})}
function importVcf(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var out=[],cards=String(r.result).split(/BEGIN:VCARD/i).slice(1);cards.forEach(function(c){var fn=c.match(/^FN[^:]*:(.*)$/im),tl=c.match(/^TEL[^:]*:(.*)$/im);out.push({name:fn?fn[1].trim():"",tel:tl?tl[1].trim():""})});addPool(out)};r.readAsText(f)}
function vPicks(){var t=td(),p=picks(),h='<h2>People to call today</h2>';if(!S.pool.length)return h+'<div class="card"><p class="mut" style="margin:0 0 8px">Import your contacts and two people will be picked for you each day.</p><button onclick="go(\'calls\')">Import contacts</button></div>';h+=p.map(function(c){return'<div class="card row"><div class="g '+(c.last==t?'done':'')+'"><b class="sans">'+esc(c.name)+'</b></div>'+(c.tel?'<a class="btn" href="tel:'+esc(c.tel)+'">Call</a>':'')+(c.last==t?'':'<button class="s" onclick="poolCalled(\''+c.id+'\')">Done</button>')+'<button class="x" onclick="delPool(\''+c.id+'\')" aria-label="Remove">✕</button></div>'}).join('');return h+'<button class="s" onclick="reroll()">Pick different people</button>'}
var WP={sunset:"linear-gradient(160deg,#1a1048,#b53d80 50%,#ff9a55)",ocean:"linear-gradient(160deg,#06283d,#1363a3 55%,#47b5ff)",forest:"linear-gradient(160deg,#0b2b1e,#1f7a4d 55%,#a9d36b)",night:"linear-gradient(160deg,#0b0b1f,#2a2a5e)",rose:"linear-gradient(160deg,#4a1233,#d6457f 60%,#ffc2d4)"};
var SW=["#1f5e4b","#2f6fdb","#7a3fd1","#d6457f","#e0701f","#c9a227","#0e9f94","#555d63"];
function lum(h){var n=parseInt(h.slice(1),16);return(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255}
function rgba(h,a){var n=parseInt(h.slice(1),16);return"rgba("+(n>>16&255)+","+(n>>8&255)+","+(n&255)+","+a+")"}
function applyStyle(){var r=document.documentElement.style,st=S.set;
if(st.accent){r.setProperty("--ac",st.accent);r.setProperty("--acs",rgba(st.accent,.22));r.setProperty("--onac",lum(st.accent)>.6?"#10201a":"#fff")}else{["--ac","--acs","--onac"].forEach(function(k){r.removeProperty(k)})}
if(st.nav){var ink=lum(st.nav)>.6?"#1d2421":"#f2f4f3";r.setProperty("--nav",st.nav);r.setProperty("--navink",ink);r.setProperty("--navon",ink)}else{["--nav","--navink","--navon"].forEach(function(k){r.removeProperty(k)})}
var bg=st.wp=="img"&&st.wpimg?'url("'+st.wpimg+'")':WP[st.wp]||"",d=st.dim==null?55:st.dim,ov="color-mix(in srgb,var(--bg) "+d+"%,transparent)";
document.body.style.background=bg?"linear-gradient("+ov+","+ov+"),"+bg+" center/cover fixed":"";
var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=st.accent||"#1f5e4b"}
function ss(k,v){S.set[k]=v;save();applyStyle()}
function setName(v){ss("name",v);var e=document.getElementById("tn");if(e)e.textContent=v||"Add your name"}
function topbar(){var st=S.set,nm=(st.name||"").trim(),ini=nm?esc(nm.charAt(0).toUpperCase()):"+";return'<div class="top"><button class="av" onclick="go(\'set\')" aria-label="Open profile">'+(st.pic?'<img src="'+st.pic+'" alt="">':ini)+'</button><div class="g"><div class="nm" id="tn">'+(nm?esc(nm):"Add your name")+'</div><div class="mut">Do-2-day</div></div></div>'}
function pickAcc(c){ss("accent",c);render()}
function setWp(k){ss("wp",k);render()}
function readImg(f,max,sq,q,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement("canvas"),w=im.width,h=im.height;if(sq){var m=Math.min(w,h);c.width=c.height=max;c.getContext("2d").drawImage(im,(w-m)/2,(h-m)/2,m,m,0,0,max,max)}else{var k=Math.min(1,max/Math.max(w,h));c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height)}cb(c.toDataURL("image/jpeg",q))};im.src=r.result};r.readAsDataURL(f)}
function setPic(e){var f=e.target.files[0];if(!f)return;readImg(f,200,true,.85,function(d){ss("pic",d);render()})}
function setWpImg(e){var f=e.target.files[0];if(!f)return;readImg(f,1000,false,.72,function(d){S.set.wpimg=d;ss("wp","img");render()})}
function resetStyle(){["accent","nav","wp","wpimg","dim"].forEach(function(k){delete S.set[k]});save();applyStyle();render()}
function vSet(){var st=S.set,h='<h1>Profile</h1><p class="sub">Your name and picture show at the top of every page. Choices are saved on this device.</p>';
h+='<h2>Your name</h2><div class="card"><input id="un" placeholder="Type your name" value="'+esc(st.name||"")+'" oninput="setName(this.value)"></div><h2>Profile picture</h2><div class="card row">'+(st.pic?'<img class="pv" src="'+st.pic+'" alt="">':'<div class="pv"></div>')+'<div class="g"><input type="file" accept="image/*" onchange="setPic(event)">'+(st.pic?'<button class="x" onclick="ss(\'pic\',\'\');render()">Remove picture</button>':'')+'</div></div>';
h+='<h2>Button and tab color</h2><div class="card"><div class="row" style="flex-wrap:wrap">'+SW.map(function(c){return'<button class="sw'+(st.accent==c?' on':'')+'" style="background:'+c+'" onclick="pickAcc(\''+c+'\')" aria-label="'+c+'"></button>'}).join("")+'</div><div class="f"><label class="mut">Custom color<input type="color" value="'+(st.accent||"#1f5e4b")+'" oninput="ss(\'accent\',this.value)"></label><button class="s" onclick="ss(\'accent\',\'\');render()">Use default</button></div></div>';
h+='<h2>Tab bar color</h2><div class="card"><div class="f" style="margin-top:0"><label class="mut">Pick a color<input type="color" value="'+(st.nav||"#1b2220")+'" oninput="ss(\'nav\',this.value)"></label><button class="s" onclick="ss(\'nav\',\'\');render()">Use default</button></div></div>';
h+='<h2>Wallpaper</h2><div class="card"><div class="wpg">'+Object.keys(WP).map(function(k){return'<button class="wpb'+(st.wp==k?' on':'')+'" style="background:'+WP[k]+'" onclick="setWp(\''+k+'\')">'+k+'</button>'}).join("")+'<button class="wpb s" style="border:3px dashed var(--line)" onclick="setWp(\'\')">None</button></div><p class="mut" style="margin:0 0 4px">Use your own photo</p><input type="file" accept="image/*" onchange="setWpImg(event)"><label class="mut" style="margin-top:12px">Dim wallpaper so text stays easy to read<input type="range" min="0" max="85" value="'+(st.dim==null?55:st.dim)+'" oninput="ss(\'dim\',+this.value)"></label></div>';
h+='<button class="s" style="margin-top:14px" onclick="resetStyle()">Reset colors and wallpaper</button>';
return h}
var poolQ="";
function delPool(id){S.pool=S.pool.filter(function(p){return p.id!=id});var ids=S.daily.ids.filter(function(i){return S.pool.some(function(p){return p.id==i})});if(ids.length<2&&S.pool.length){rand(3).forEach(function(i){if(ids.indexOf(i)<0&&ids.length<2)ids.push(i)})}S.daily.ids=ids;save();render()}
function poolList(){var q=poolQ.toLowerCase(),l=S.pool.filter(function(p){return(p.name+p.tel).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return a.name.localeCompare(b.name)}),h=l.slice(0,40).map(function(p){return'<div class="row" style="padding:2px 0;border-top:1px solid var(--line)"><div class="g">'+esc(p.name)+(p.tel?' <span class="mut">'+esc(p.tel)+'</span>':'')+'</div><button class="x" onclick="delPool(\''+p.id+'\')" aria-label="Remove">✕</button></div>'}).join("");return h+(l.length>40?'<p class="mut">'+(l.length-40)+' more. Type a name to find them.</p>':'')||'<p class="mut">No match.</p>'}
var AC;
function SELSND(id,w){return'<select id="'+id+'"'+(w?' class="w"':'')+'><option value="">No sound</option><option value="chime">Chime</option><option value="bell">Bell</option><option value="alarm">Alarm</option></select>'}
function beep(k){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();var P={chime:[[880,0],[1175,.18],[1568,.36]],bell:[[660,0],[660,.5]],alarm:[[900,0],[700,.2],[900,.4],[700,.6],[900,.8]]}[k]||[];P.forEach(function(n){var o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+n[1];o.type=k=="alarm"?"square":"sine";o.frequency.value=n[0];g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(k=="alarm"?.15:.3,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+(k=="bell"?.9:.25));o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+1)})}catch(e){}}
document.addEventListener("pointerdown",function(){beep("")},{once:true});
function chime(){var t=td(),n=new Date(),hm=pad(n.getHours())+":"+pad(n.getMinutes());S.played=S.played||{};if(S.pday!=t){S.played={};S.pday=t}
function fire(key,title,snd){if(S.played[key])return;S.played[key]=1;save();beep(snd);if(window.Notification&&Notification.permission=="granted"){try{new Notification(title)}catch(e){}}}
S.tasks.forEach(function(x){if(!x.done&&x.snd&&x.date==t&&x.time&&x.time<=hm)fire(x.id,x.title,x.snd)});
eventsOn(t).forEach(function(e){if(e.snd)fire(e.id,e.title,e.snd)})}
function vToday(){var t=td(),list=tasksOn(t),dn=list.filter(function(x){return x.done}).length,al=alerts();
var h='<h1>Today</h1><p class="sub">'+new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"})+'</p>';
h+=al.length?al.map(function(a){return'<div class="alert '+a[0]+'">'+esc(a[1])+'</div>'}).join(""):'<div class="alert ok">Nothing needs your attention right now.</div>';
if(window.Notification&&Notification.permission!="granted")h+='<button class="s" onclick="ask()">Turn on daily reminder alerts</button>';
h+=vPicks();h+='<h2>Today’s plan: '+dn+' of '+list.length+' done</h2><div class="bar"><i style="width:'+(list.length?dn/list.length*100:0)+'%"></i></div>';
h+=list.length?list.map(taskRow).join(""):'<p class="mut">No activities planned for today. Add one below.</p>';
h+='<div class="card"><input id="tt" placeholder="New activity"><div class="f"><input id="td" type="date" value="'+t+'"><input id="tm" type="time">'+SELSND("ts")+'<button class="s" onclick="beep(v(\'ts\'))">Test sound</button><button class="w" onclick="addTask()">Add activity</button></div></div>';
var ev=eventsOn(t);if(ev.length)h+='<h2>Events today</h2>'+ev.map(function(e){return'<div class="card">'+esc(e.title)+'</div>'}).join("");
var od=S.tasks.filter(function(x){return!x.done&&x.date<t});if(od.length)h+='<h2>Undone from earlier days</h2>'+od.map(taskRow).join("");
return h}

function vCal(){var p=cm.split("-"),y=+p[0],m=+p[1]-1,first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),t=td();
var h='<h1>Calendar</h1><div class="row sans"><button class="s" onclick="shift(-1)">‹</button><div class="g" style="text-align:center"><b>'+new Date(y,m,1).toLocaleDateString(undefined,{month:"long",year:"numeric"})+'</b></div><button class="s" onclick="shift(1)">›</button></div><div class="cal" style="margin-top:8px">';
"SMTWTFS".split("").forEach(function(d){h+="<b>"+d+"</b>"});
for(var i=0;i<first;i++)h+="<span></span>";
for(var d=1;d<=n;d++){var s=cm+"-"+pad(d),c=(s==t?"t ":"")+(s==sel?"sel ":"")+((tasksOn(s).length||eventsOn(s).length)?"dot":"");h+='<button class="'+c+'" onclick="pickDay(\''+s+'\')">'+d+'</button>'}
h+='</div><h2>'+nice(sel)+'</h2>';
var tk=tasksOn(sel),ev=eventsOn(sel);
h+=ev.map(function(e){return'<div class="card">'+esc(e.title)+(e.yearly?' <span class="mut">(yearly)</span>':"")+'</div>'}).join("");
h+=tk.length?tk.map(taskRow).join(""):(ev.length?"":'<p class="mut">Nothing planned for this day.</p>');
h+='<div class="card"><input id="tt" placeholder="Add activity for this day"><div class="f"><input id="tm" type="time">'+SELSND("ts")+'<button class="w" onclick="addTask(\''+sel+'\')">Add</button></div></div>';
h+='<h2>Add an event</h2><div class="card"><input id="et" placeholder="Birthday, anniversary, appointment…"><div class="f"><input id="ed" type="date" value="'+sel+'"><select id="ey"><option value="y">Repeats every year</option><option value="n">One time</option></select>'+SELSND("es",1)+'<button class="w" onclick="addEvent()">Save event</button></div></div>';
var up=S.events.map(function(e){return{e:e,n:nextOcc(e)}}).filter(function(o){return diff(t,o.n)>=0}).sort(function(a,b){return a.n<b.n?-1:1}).slice(0,8);
if(up.length)h+='<h2>Coming up</h2>'+up.map(function(o){var d=diff(t,o.n);return'<div class="card row"><div class="g">'+esc(o.e.title)+'<div class="mut">'+nice(o.n)+' · '+(d==0?"today":d+" days")+'</div></div><button class="x" onclick="del(\'events\',\''+o.e.id+'\')">✕</button></div>'}).join("");
return h}

function vCalls(){var t=td(),cs=S.contacts.slice().sort(function(a,b){return callDue(a)<callDue(b)?-1:1});
var h='<h1>Calls</h1><p class="sub">Set how often you want to call each person. The app tells you who is due.</p>';
h+=cs.length?cs.map(function(c){var d=diff(t,callDue(c));var st=d<0?'<span class="exp">overdue by '+(-d)+' day'+(d==-1?"":"s")+'</span>':d==0?'<b>call today</b>':'next in '+d+' days';
return'<div class="card row"><div class="g"><b class="sans">'+esc(c.name)+'</b> <span class="mut">'+esc(c.rel)+'</span><div class="mut">Every '+c.freq+' days · last: '+(c.last?nice(c.last):"never")+' · '+st+'</div></div><button onclick="called(\''+c.id+'\')">Called</button><button class="x" onclick="del(\'contacts\',\''+c.id+'\')">✕</button></div>'}).join(""):'<p class="mut">No one added yet.</p>';
h+='<h2>Contacts for daily calls</h2><div class="card"><p class="mut" style="margin:0 0 8px">'+S.pool.length+' contacts imported. Two are picked at random each day.</p>'+(("contacts"in navigator&&"ContactsManager"in window)?'<button onclick="pickContacts()">Choose from phone contacts</button>':'<p class="mut">This browser cannot open your contact list. Import a .vcf file instead.</p>')+'<p class="mut" style="margin-bottom:4px">Import a .vcf contacts file</p><input type="file" accept=".vcf,text/vcard" onchange="importVcf(event)"><button class="x" onclick="clearPool()">Remove all imported</button></div>';if(S.pool.length)h+='<h2>Imported contacts</h2><div class="card"><input placeholder="Search by name" value="'+esc(poolQ)+'" oninput="poolQ=this.value;document.getElementById(\'pl\').innerHTML=poolList()"><div id="pl">'+poolList()+'</div></div>';h+='<h2>Add a person</h2><div class="card"><input id="cn" placeholder="Name"><div class="f"><input id="cr" placeholder="Mother, friend…"><input id="cf" type="number" min="1" placeholder="Call every (days)" value="7"><button class="w" onclick="addContact()">Add to call schedule</button></div></div>';
return h}

function vMoney(){var m=sums(),b=S.set.budget,g=S.set.goal;
var h='<h1>Finance</h1><p class="sub">This month</p><div class="card"><div class="row"><div class="g">Income<br><b class="inc sans">'+money(m.i)+'</b></div><div class="g">Spent<br><b class="exp sans">'+money(m.e)+'</b></div><div class="g">Saved<br><b class="sans">'+money(m.s)+'</b></div></div>';
if(b>0)h+='<div class="mut" style="margin-top:10px">Budget: '+money(m.e)+' of '+money(b)+'</div><div class="bar"><i style="width:'+Math.min(100,m.e/b*100)+'%;background:'+(m.e>b?"var(--bad)":"var(--ac)")+'"></i></div>';
if(g>0)h+='<div class="mut" style="margin-top:10px">Savings goal: '+money(Math.max(0,m.s))+' of '+money(g)+'</div><div class="bar"><i style="width:'+Math.min(100,Math.max(0,m.s)/g*100)+'%"></i></div>';
h+='</div>';
var cats=Object.keys(m.cat).sort(function(a,b){return m.cat[b]-m.cat[a]});
if(cats.length)h+='<h2>Spending by category</h2>'+cats.map(function(c){return'<div class="mut">'+esc(c)+' · '+money(m.cat[c])+' ('+Math.round(m.cat[c]/m.e*100)+'%)</div><div class="bar" style="margin-bottom:8px"><i style="width:'+m.cat[c]/m.e*100+'%"></i></div>'}).join("");
h+='<h2>Add a transaction</h2><div class="card"><div class="tabs"><button class="'+(txType=="expense"?"":"s")+'" onclick="setType(\'expense\')">Expense</button><button class="'+(txType=="income"?"":"s")+'" onclick="setType(\'income\')">Income</button></div><input id="xn" placeholder="'+(txType=="income"?"Source, e.g. salary":"What for, e.g. lunch, bus fare")+'"><div class="f"><input id="xa" type="number" step="any" placeholder="Amount"><input id="xd" type="date" value="'+td()+'">';
if(txType=="expense")h+='<select id="xc" class="w"><option value="">Category: detect automatically</option>'+Object.keys(CATS).concat("Other").map(function(c){return"<option>"+c+"</option>"}).join("")+'</select>';
h+='<button class="w" onclick="addTx()">Save</button></div></div>';
h+='<h2>Monthly plan</h2><div class="card"><div class="f" style="margin-top:0"><input id="sb" type="number" placeholder="Spending budget" value="'+(b||"")+'"><input id="sg" type="number" placeholder="Savings goal" value="'+(g||"")+'"><button class="w s" onclick="setBG()">Save plan</button></div></div>';
var tx=S.tx.slice().sort(function(a,b){return a.date<b.date?1:-1}).slice(0,15);
if(tx.length)h+='<h2>Recent</h2>'+tx.map(function(x){return'<div class="card row"><div class="g">'+esc(x.note||x.cat)+'<div class="mut">'+nice(x.date)+' · '+esc(x.cat)+'</div></div><b class="sans '+(x.type=="income"?"inc":"exp")+'">'+(x.type=="income"?"+":"-")+money(x.amt)+'</b><button class="x" onclick="del(\'tx\',\''+x.id+'\')">✕</button></div>'}).join("");
h+='<h2>Backup</h2><div class="row"><button class="s" onclick="exportData()">Export data</button><label class="mut">Restore: <input type="file" accept=".json" onchange="importData(event)"></label></div><p class="mut">Data is stored only on this device. Export a backup now and then.</p>';
return h}

function render(){var y=window.scrollY,V={today:vToday,cal:vCal,calls:vCalls,money:vMoney,set:vSet};
document.getElementById("app").innerHTML=topbar()+V[T]();
var N={today:"Today",cal:"Calendar",calls:"Calls",money:"Finance",set:"Profile"};
document.getElementById("nav").innerHTML=Object.keys(N).map(function(k){return'<button class="'+(k==T?"on":"")+'" onclick="go(\''+k+'\')">'+N[k]+'</button>'}).join("");
window.scrollTo(0,y)}
if("serviceWorker"in navigator&&location.protocol.indexOf("http")==0)navigator.serviceWorker.register("sw.js").catch(function(){});
applyStyle();render();notify();chime();setInterval(function(){notify();chime()},3e4);
</script>
</body>
</html>
