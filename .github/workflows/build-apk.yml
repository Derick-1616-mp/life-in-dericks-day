name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Collect web files
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js *.png www/

      - name: Create the Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Do-2-day" com.electrocat.do2day --web-dir www
          npx cap add android

      - name: Add the music scanner
        run: |
          DIR=android/app/src/main/java/com/electrocat/do2day
          cp MusicPlugin.java $DIR/MusicPlugin.java
          cat > $DIR/MainActivity.java <<'JAVA'
          package com.electrocat.do2day;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MusicPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: App icon
        continue-on-error: true
        run: |
          mkdir -p assets
          convert icon-512.png -resize 1024x1024 assets/icon-only.png
          convert maskable-512.png -resize 1024x1024 assets/icon-foreground.png
          convert -size 1024x1024 xc:'#1f5e4b' assets/icon-background.png
          npx --yes @capacitor/assets generate --android

      - name: Use the same signing key every time
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build the app
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish the app file
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Do-2-day app ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
